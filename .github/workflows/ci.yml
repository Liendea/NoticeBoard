name: Monorepo CI (TypeScript Linting)

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

# Tvinga GitHubs egna interna skript att köra på Node 24+ för att slippa varningen
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lint-project:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22" # Kör på Node 22 (LTS) för bästa stabilitet i miljön
          cache: "npm"

      - name: Install Frontend Dependencies
        run: npm ci --prefix frontend --legacy-peer-deps # Lade till flaggan här också!

      - name: Install Backend Dependencies
        run: npm ci --prefix backend

      - name: Run ESLint on Frontend and Backend
        run: npm run lint --prefix .
