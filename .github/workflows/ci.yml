name: Monorepo CI/CD Pipeline

on:
  push:
    branches: ["main"]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # 1. CI-JOBBET (Kontrollera koden)
  lint-project:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install Frontend Dependencies
        run: npm ci --prefix frontend --legacy-peer-deps

      - name: Install Backend Dependencies
        run: npm ci --prefix backend

      - name: Run ESLint on Frontend
        run: npm run lint --prefix frontend

      - name: Run ESLint on Backend
        run: npm run lint --prefix backend

  # 2. CD-JOBBET (Bygg på GitHub och skicka till AWS)
  build-and-deploy:
    runs-on: ubuntu-latest
    needs: lint-project
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Logga in på AWS från GitHub Actions
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-north-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push Backend Image to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: notice-board
          IMAGE_TAG: latest
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG ./backend
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      - name: Build, tag, and push Frontend Image to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: notice-board-frontend
          IMAGE_TAG: latest
          # Miljövariabel skickas in i frontenden UNDER BYGGET på GitHub!
          VITE_BACKEND_URL: ${{ secrets.VITE_BACKEND_URL }}
        run: |
          docker build --build-arg VITE_BACKEND_URL=$VITE_BACKEND_URL -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG ./frontend
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      # SSH in på EC2 och starta om med de nya bilderna
      - name: Deploy to AWS EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/app
            # Logga in på ECR från servern för att få ladda ner
            aws ecr get-login-password --region eu-north-1 | docker login --username AWS --password-stdin ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.eu-north-1.amazonaws.com
            # Hämta de nya bilderna som GitHub just byggde
            docker compose pull
            # Starta om containrarna utan att bygga något lokalt
            docker compose up -d --force-recreate
