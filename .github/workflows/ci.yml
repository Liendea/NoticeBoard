name: Monorepo CI/CD Pipeline

on:
  push:
    branches: ["main"]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # 1. CI-JOBBET
  lint-project:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install Frontend Dependencies
        run: npm ci --prefix frontend --legacy-peer-deps

      - name: Install Backend Dependencies
        run: npm ci --prefix backend

      - name: Run ESLint on Frontend
        run: npm run lint --prefix frontend

      - name: Run ESLint on Backend
        run: npm run lint --prefix backend

  # 2. CD-JOBBET
  deploy-project:
    runs-on: ubuntu-latest
    needs: lint-project # Körs bara om lint-project lyckas!

    steps:
      - name: Deploy to AWS EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets::EC2_HOST }}
          username: ${{ secrets::EC2_USERNAME }}
          key: ${{ secrets::EC2_SSH_KEY }}
          script: |
            # 1. Gå till mappen där ditt projekt ligger på servern
            cd ~/app

            # 2. Hämta den senaste koden från GitHub
            git pull origin main

            # 3. Bygg om och starta appen i bakgrunden (-d) utan cache
            docker compose build --no-cache
            docker compose up -d
