version: "3.8"

services:
  backend-service:
    build:
      context: ./backend

      dockerfile: Dockerfile
    ports:
      - "5001:3000"
    environment:
      - PORT=3000
      - DATABASE_URL=${DATABASE_URL}

  frontend-service:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"
